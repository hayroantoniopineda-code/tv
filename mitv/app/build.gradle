plugins { id 'com.android.application' version '8.5.2' }

def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.mitv.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mitv.launcher'
        minSdk 23
        targetSdk 34
        versionCode build
        versionName "1.0.$build"
    }
    signingConfigs {
        rel {
            storeFile file('../mitv.jks')
            storePassword 'mitv1234'
            keyAlias 'mitv'
            keyPassword 'mitv1234'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.rel
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
