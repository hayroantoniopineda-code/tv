name: Fondos Mi TV

on:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths: ['mitv/fondos/**', '.github/workflows/fondos.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fondos
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generar lista central de paisajes
        timeout-minutes: 40
        run: python3 mitv/fondos/generar.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "mitv-bot"
          git config user.email "mitv-bot@users.noreply.github.com"
          git add fondos
          git diff --cached --quiet || git commit -m "fondos: lista del $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
